deploy:
  enabled: true

namespace:
  create: false
  name: shiftwise-ai

image:
  useBuildOutput: true
  repository: default-route-openshift-image-registry.apps-crc.testing/shiftwise-ai/kubeoptix-analyzer
  tag: latest
  pullPolicy: Always

build:
  enabled: true
  registryHost: image-registry.openshift-image-registry.svc:5000
  imageStreamName: kubeoptix-analyzer
  outputTag: latest
  containerfilePath: Containerfile
  source:
    gitUri: https://github.com/ShiftWise-AI/kubeoptix-analyzer.git
    gitRef: feature/ocp
    contextDir: ""
  sourceSecret:
    create: true
    name: "github-auth"
    username: ""
    token: ""

nameOverride: ""
fullnameOverride: ""

startup:
  loginWithServiceAccount: false
  script: ""

podEnv:
  HOME: /tmp
  KUBECONFIG: /tmp/kubeconfig

rbac:
  createClusterRoleBinding: true
  clusterRoleName: cluster-reader

service:
  headless:
    enabled: true
    name: harvester
    port: 8000
  api:
    enabled: true
    name: harvester-api
    type: ClusterIP
    port: 8000
    targetPort: 8000

route:
  enabled: true
  name: harvester
  host: ""
  termination: edge
  insecureEdgeTerminationPolicy: Redirect

scalePolicy:
  enabled: true
  maxReplicas: 1

persistence:
  enabled: true
  existingClaim: harvester-app-data
  mountPath: /app/data


resources: {}
