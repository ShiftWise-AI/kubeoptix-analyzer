{{- $secretEnv := .Values.secretEnv | default dict }}
{{- if ($secretEnv.create | default false) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeoptix-analyzer.secretEnvName" . }}
  namespace: {{ include "kubeoptix-analyzer.namespace" . }}
  labels:
    {{- include "kubeoptix-analyzer.labels" . | nindent 4 }}
type: Opaque
stringData:
  CURSOR_API_KEY: {{ $secretEnv.cursorApiKey | quote }}
  CURSOR_MODEL: {{ ($secretEnv.cursorModel | default "composer-2.5") | quote }}
  LLM_API_KEY: {{ $secretEnv.llmApiKey | quote }}
  LLM_BASE_URL: {{ ($secretEnv.llmBaseUrl | default "https://api.openai.com/v1") | quote }}
  LLM_MODEL: {{ ($secretEnv.llmModel | default "gpt-4o-mini") | quote }}
{{- end }}