{{- if .Values.deploy.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kubeoptix-analyzer.fullname" . }}
  namespace: {{ include "kubeoptix-analyzer.namespace" . }}
  labels:
    {{- include "kubeoptix-analyzer.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.service.headless.name }}
  # This workload is intentionally single-instance.
  replicas: 1
  selector:
    matchLabels:
      {{- include "kubeoptix-analyzer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeoptix-analyzer.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: kubeoptix-analyzer
          {{- $probes := .Values.probes | default dict }}
          {{- $secretEnv := .Values.secretEnv | default dict }}
          image: "{{ include "kubeoptix-analyzer.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.startup.loginWithServiceAccount }}
          command:
            - /bin/sh
            - -c
          args:
            - |
{{ .Values.startup.script | indent 14 }}
          {{- end }}
          env:
            - name: HOME
              value: {{ .Values.podEnv.HOME | quote }}
            - name: KUBECONFIG
              value: {{ .Values.podEnv.KUBECONFIG | quote }}
            {{- range $name, $value := (.Values.env | default dict) }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: TZ
              value: {{ .Values.podEnv.TZ | quote }}
          {{- if or ($secretEnv.create | default false) $secretEnv.name }}
          envFrom:
            - secretRef:
                name: {{ include "kubeoptix-analyzer.secretEnvName" . }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.api.targetPort }}
              protocol: TCP
          {{- if ($probes.enabled | default false) }}
          startupProbe:
            httpGet:
              path: {{ $probes.path }}
              port: http
            initialDelaySeconds: {{ $probes.startup.initialDelaySeconds }}
            periodSeconds: {{ $probes.startup.periodSeconds }}
            timeoutSeconds: {{ $probes.startup.timeoutSeconds }}
            failureThreshold: {{ $probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ $probes.path }}
              port: http
            initialDelaySeconds: {{ $probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ $probes.path }}
              port: http
            initialDelaySeconds: {{ $probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: app-data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: {{ default .Values.persistence.name .Values.persistence.existingClaim }}
      {{- end }}
{{- end }}
