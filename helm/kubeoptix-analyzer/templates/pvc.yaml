{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
{{- $resolvedStorageClassName := include "kubeoptix-analyzer.storageClassName" . | trim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kubeoptix-analyzer.pvcClaimName" . }}
  labels:
    {{- include "kubeoptix-analyzer.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if $resolvedStorageClassName }}
  storageClassName: {{ $resolvedStorageClassName }}
  {{- end }}
{{- end }}
