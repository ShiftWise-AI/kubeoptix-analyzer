replicaCount: 1

image:
  repository: kubeoptix-analyzer
  tag: latest
  pullPolicy: IfNotPresent

buildConfig:
  enabled: true
  sourceSecretName: github-auth
  git:
    uri: https://github.com/ShiftWise-AI/kubeoptix-analyzer.git
    ref: feature/ocp
    contextDir: ""
  dockerfilePath: Containerfile
  output:
    imageStreamName: kubeoptix-analyzer
    tag: latest
  triggers:
    configChange: true

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

route:
  enabled: true
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

env:
  KUBEOPTIX_MODE: local
  KUBEOPTIX_LOCALE: en-US
  KUBEOPTIX_API_HOST: 0.0.0.0
  KUBEOPTIX_API_PORT: "8080"

persistence:
  enabled: true
  # Set when you want to use an already-existing PVC (then claimName/size/storageClassName are ignored).
  existingClaim: "harvester-app-data"
  # Name for the PVC created by this chart when existingClaim is empty.
  claimName: "harvester-app-data"
  size: 10Gi
  # Set to "auto" to select a class from the cluster (default class first, then first available).
  # Set an explicit class name to force a specific class.
  storageClassName: "auto"
  accessModes:
    - ReadWriteOnce

extraEnv: []
